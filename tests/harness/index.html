<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regroupeur — banc de test</title>
    <link rel="icon" href="/icons/icon-32.png" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #eef1f5;
        color: #333;
      }
      .fake-site {
        max-width: 760px;
        padding: 40px;
      }
      .fake-site h1 {
        margin: 0 0 8px;
      }
      body.store {
        min-height: 100vh;
        background: #eef1f5 linear-gradient(#13284c, #13284c) no-repeat top / 100% 64px;
      }
      body.store .fake-site {
        padding-top: 96px;
        color: #1b2130;
      }
      .article-row {
        display: flex;
        gap: 12px;
        padding: 4px 0;
        border-bottom: 1px solid #d5dbe3;
        font-size: 13px;
      }
      .article-row .col-product,
      .article-row .product-comments {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="fake-site">
      <h1>Mew ex (MEW 151)<span> Scarlet &amp; Violet 151 - Singles</span></h1>
      <p>Page Cardmarket simulée : banc de test du Regroupeur, le « site » répond depuis <code>world.js</code>.</p>
      <div class="table article-table"><div class="table-body" id="offers"></div></div>
    </div>
    <script src="world.js"></script>
    <script>
      // Les offres de la carte affichée, comme sur la vraie page (pour les repères « ★ ton plan »).
      document.getElementById('offers').innerHTML = window.__world.productRowsHtml('Pokemon/Products/Singles/Scarlet-Violet-151/Mew-ex-MEW151');
      // ?store : page épurée pour les captures de la fiche Chrome Web Store
      if (location.search.includes('store')) {
        document.querySelector('.fake-site p').remove();
        document.getElementById('offers').parentElement.remove();
        document.body.classList.add('store');
      }
    </script>
    <script>
      // Contexte simulé : l'utilisateur regarde la page de Mew ex.
      window.CMR = { testPageUrl: 'https://www.cardmarket.com/fr/Pokemon/Products/Singles/Scarlet-Violet-151/Mew-ex-MEW151' };
    </script>
    <script src="/src/cm.js"></script>
    <script src="/src/optimizer.js"></script>
    <script src="/src/fetcher.js"></script>
    <script src="/src/storage.js"></script>
    <script src="/src/analyzer.js"></script>
    <script src="/src/cart.js"></script>
    <script src="/src/panel.js"></script>
    <script src="/src/content.js"></script>
  </body>
</html>
